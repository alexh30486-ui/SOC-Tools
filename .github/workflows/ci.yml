name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: API unit tests
        run: cd api && python3 -m unittest discover -s tests -v
      - name: SOC integration tests
        run: python3 -m unittest discover -s tests/integration -v
      - name: Project and playbook tests
        run: python3 -m unittest discover -s tests -v
      - name: Shell syntax of tools
        run: sh -n tools/protect_main.sh && sh -n run.sh

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          python3 -m pip install playwright==1.49.0
          python3 -m playwright install --with-deps chromium
      - name: Current v12 frontend smoke (20 real interactions, offline vendor runtime)
        run: python3 tests/e2e/current_v12_smoke.py
      - name: Keep screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-ui-smoke
          path: |
            tests/e2e/shots/ci-v12-*.png
            tests/e2e/shots/ci-v12-smoke-results.json
          if-no-files-found: ignore
